<style>
  :root {
    --bg: #0b0b0c;
    --card: #151517;
    --line: #2a2a2e;
    --text: #f3f1ec;
    --muted: #a19d94;
    --gold: #d4a937;
    --gold-hi: #f0cd6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(212,169,55,.16), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; justify-content: center;
    padding: max(48px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 440px; text-align: center; }

  .avatar {
    position: relative; width: 120px; height: 120px; margin: 0 auto 20px;
    border-radius: 50%; padding: 3px;
    background: linear-gradient(140deg, var(--gold-hi), var(--gold) 45%, #7a5c12);
    box-shadow: 0 0 40px rgba(212,169,55,.25);
  }
  .avatar span, .avatar img {
    position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px);
    border-radius: 50%; background: var(--card);
  }
  .avatar span {
    display: grid; place-items: center;
    font-size: 44px; font-weight: 900; color: var(--gold);
  }
  .avatar img { object-fit: cover; }

  h1 {
    margin: 0; font-size: 28px; line-height: 1.15; font-weight: 900;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .handle { margin: 6px 0 0; color: var(--gold); font-weight: 600; font-size: 15px; }
  .tagline { margin: 14px auto 0; max-width: 32ch; color: var(--muted); font-size: 15px; }
  .rule { width: 48px; height: 2px; margin: 28px auto; background: var(--gold); border: 0; }

  .links { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .links a {
    display: flex; align-items: center; gap: 14px;
    min-height: 58px; padding: 0 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    color: var(--text); text-decoration: none; font-weight: 700; font-size: 16px;
    transition: border-color .15s, transform .15s, background .15s;
  }
  .links a:hover, .links a:focus-visible {
    border-color: var(--gold); background: #1b1a17; transform: translateY(-1px); outline: none;
  }
  .links a:active { transform: scale(.98); }
  .links svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--gold); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .links .label { flex: 1; text-align: left; }
  .links .arrow { color: var(--muted); font-size: 18px; }
  .links .primary { background: var(--gold); border-color: var(--gold); color: #121212; }
  .links .primary svg { stroke: #121212; }
  .links .primary .arrow { color: #121212; }
  .links .primary:hover, .links .primary:focus-visible { background: var(--gold-hi); border-color: var(--gold-hi); }

  footer { margin-top: 36px; color: #5f5c56; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }

  @media (prefers-reduced-motion: reduce) { .links a { transition: none; } }
</style>
